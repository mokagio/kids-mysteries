{{- $word := trim .Inner " " -}}
{{- $id := printf "def-%s" (urlize $word) -}}
{{- /* One printf, trimmed both ends: any stray newline here lands as a space in
       the middle of a sentence, right before the punctuation. */ -}}
{{- printf `<button type="button" class="glossary" popovertarget="%s">%s</button><span class="glossary-card" id="%s" popover><b>%s</b> — %s</span>` $id $word $id $word (.Get "def") | safeHTML -}}
