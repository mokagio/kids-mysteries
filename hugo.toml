baseURL = "https://mokagio.github.io/kids-mysteries/"
locale = "en-au"
title = "The Young Detectives Club"

# Without this, a front matter `date: 2026-08-06` is read as UTC midnight, which is
# still in the future here — and Hugo drops future-dated pages from the build.
timeZone = "Australia/Melbourne"

enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
tagline = "Small mysteries for big detectives in the making"

# The `word` shortcode emits a popover button, and it has to survive the
# `markdownify` call inside `clues` and `solution` — which strips raw HTML unless
# this is on. All content here is first-party.
[markup.goldmark.renderer]
unsafe = true

[markup.tableOfContents]
startLevel = 2
