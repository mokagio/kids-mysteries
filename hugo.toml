baseURL = "/"
locale = "en-au"
title = "The Young Detectives Club"

# Without this, a front matter `date: 2026-08-06` is read as UTC midnight, which is
# still in the future here — and Hugo drops future-dated pages from the build.
timeZone = "Australia/Melbourne"

enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
tagline = "Big mysteries for small detectives"

[markup.goldmark.renderer]
unsafe = false

[markup.tableOfContents]
startLevel = 2
