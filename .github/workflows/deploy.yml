name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Hugo drops future-dated pages, so a case written ahead of time only appears
  # once something rebuilds. 15:00 UTC is just after midnight in Melbourne.
  # GitHub suspends schedules after 60 days without a commit — push to revive.
  schedule:
    - cron: 0 15 * * *
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it — a half-deployed site is
# worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
    steps:
      - uses: actions/checkout@v7

      - name: Install Hugo
        run: |
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" -o hugo.deb
          sudo dpkg -i hugo.deb
          hugo version

      - uses: actions/configure-pages@v6
        id: pages
        with:
          # Turn Pages on if it isn't already, so a fresh fork or a re-created
          # repo doesn't fail this step before anyone can click the setting.
          enablement: true

      # The site is served from /<repo>/, so the baseURL has to carry that path or
      # every stylesheet and link 404s. `configure-pages` reports it.
      - run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
